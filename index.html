<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2b36">
<title>Veille de prix</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Veille de prix</h1>
  <button class="btn small" id="themeBtn" aria-label="Changer le thème jour ou nuit">Auto</button>
</header>
<main>
  <p class="sub h" id="maj">Chargement…</p>
  <div id="liste"></div>
  <p class="sub h legende">
    <span class="badge cible">Dans la cible</span> prix total ≤ prix souhaité + 5 % ·
    <span class="badge proche">Proche</span> jusqu'à + 10 % (sans alerte).
    Prix total = prix + port. Aide à la décision, jamais un verdict : la décision vous revient.
  </p>
</main>
<script src="js/app.js"></script>
</body>
</html>
